<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="script.js"> </script>
</head>

<body>

  <div id="nav-bar">
    <img id="menu-button" src="menu.svg" width="25" height="25">
    <div id="divider"></div>
    <div id="shop-button">Shop</div>
    <div id="divider"> </div>
    <form id="search-form">
      <input id="search-input" type="text" placeholder="Search">
      <img id="search-sign" src="search.svg" width="15", height="15">
    </form>
    <div id = "log-in-button">Log in</div>
  </div>
  <div id="loginScreen">
    <div id="loginContent">
      <h1 contenteditable="true" style="color: #4ad337; font-size: 2em; font-family: sans-serif;">Здравствуйте!</h1>
      <p contenteditable="true" style="color: #5fa368; font-size: 1.2em; font-family: sans-serif;">Пожалуйста,
        войдите в аккаунт</p>
      <label for="username" contenteditable="true" style="color:white; font-size: 1.1em;">Телефон или почта:</label><br>
      <input type="text" id="username" placeholder="Введите телефон или почту"><br>
      <label for="password" contenteditable="true" style="color:white; font-size: 1.1em;">Пароль:</label><br>
      <input type="password" id="password" placeholder="Введите пароль"><br>
      <button id="loginButton">Войти</button>
    </div>
  </div>

  <div id="calculator" class="content-section active">
  <div id="calculator-body">
    <!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->

    <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
     <div id="result-window">
    <div id="result" class="result">
      0
    </div>
    <div id="calculation-history"></div>
  </div>

    <!-- блок с кнопками калькулятора. -->
    <div>
      <!--горизонтальный ряд из четырех кнопок-->
      <div>
        <button id="btn_op_clear" class="my-btn secondary">C</button>
        <button id="btn_op_sign" class="my-btn secondary">+/-</button>
        <button id="btn_op_percent" class="my-btn secondary">%</button>
        <button id="btn_op_div" class="my-btn primary">/</button>
        <button id="btn_op_backspace" class="my-btn secondary">⌫</button>
      </div>

      <div>
        <button id="btn_digit_7" class="my-btn">7</button>
        <button id="btn_digit_8" class="my-btn">8</button>
        <button id="btn_digit_9" class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn primary">x</button>
        <button id="btn_op_sq" class="my-btn secondary">x²</button>
      </div>

      <div>
        <button id="btn_digit_4" class="my-btn">4</button>
        <button id="btn_digit_5" class="my-btn">5</button>
        <button id="btn_digit_6" class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn primary">-</button>
        <button id="btn_op_fact" class="my-btn secondary">x!</button>
      </div>

      <div>
        <button id="btn_digit_1" class="my-btn">1</button>
        <button id="btn_digit_2" class="my-btn">2</button>
        <button id="btn_digit_3" class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn primary">+</button>
        <button id="btn_op_sqrt" class="my-btn secondary">√</button>
      </div>

      <div>
        <button id="btn_digit_0" class="my-btn">0</button>
        <button id="btn_digit_000" class="my-btn">000</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn primary execute">=</button>
      </div>
      <div>
        <select id="list" class="list">
          <option value="first">Классический</option>
          <option value="second">Инженерный</option>
        </select>
      </div>
    </div>
  </div>
  </div>
</div>
